# Local service-mode stack. `docker compose -f deploy/docker-compose.yml up`
#
# Postgres and Redis are the only required infrastructure. There is no broker:
# a notification is accepted when Postgres commits, workers claim from the queue
# table, and scheduled jobs are single-owner through row leases. NATS JetStream is
# an optional ingest path only (NOTIFY_INGEST_NATS_URL).

name: intel-notification

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notify
    ports: [ "5432:5432" ]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied in filename order on first boot of an empty volume.
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d notify" ]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # noeviction: under memory pressure a quota counter must not be evicted, or a
    # tenant's ceiling silently rises. The pre-check losing entries is merely slower,
    # and the live stream is at-most-once by design; neither affects correctness.
    command: [ "redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes" ]
    ports: [ "6379:6379" ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 20

  notifyd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      NOTIFY_PG_DSN: postgres://postgres:postgres@postgres:5432/notify?sslmode=disable
      NOTIFY_REDIS_URL: redis://redis:6379/0
      NOTIFY_REALM_BINDINGS: local-producer=local
      NOTIFY_SHARDS: "16"
    ports:
      - "8080:8080"   # REST, recipient-facing
      - "9090:9090"   # gRPC, producer-facing -- internal network in production
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  # notifyd runs the dispatcher and the maintenance jobs in-process by default.
  # Split them out when delivery volume needs to scale independently of the API
  # tier; any number of dispatcher replicas is safe (leased, fenced claims).
  # dispatcher:
  #   build: { context: .., dockerfile: deploy/Dockerfile }
  #   command: [ "--role=dispatcher" ]

volumes:
  pgdata:
  redisdata:
