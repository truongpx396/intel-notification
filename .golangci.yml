# golangci-lint v2. Two jobs: keep the extraction guarantee — "this module stands
# alone" — checked by CI rather than promised in a README, and hold the test
# conventions in docs/testing.md without relying on review to notice.
version: "2"

run:
  timeout: 5m
  # Integration tests are code too; lint them.
  build-tags:
    - integration

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - bodyclose
    - contextcheck
    - errorlint
    - usetesting   # t.Context(), t.TempDir(), t.Setenv() over hand-rolled versions
    - paralleltest # every test and subtest calls t.Parallel() (docs/testing.md)
    - tparallel    # ...and calls it correctly, so subtests actually run in parallel
    - thelper      # test helpers call t.Helper(), so failures point at the caller

  settings:
    depguard:
      rules:
        # 1. The CORE is pure: no infra, no transport. Swapping Postgres for
        #    anything else must not touch a single line under these paths.
        core-is-pure:
          list-mode: lax
          files:
            - "**/domain/**"
            - "**/ports/**"
            - "**/app/**"
          deny:
            - pkg: "github.com/jackc/pgx"
              desc: "no database driver in the core -- use the Store ports"
            - pkg: "github.com/redis/go-redis"
              desc: "no cache client in the core -- use the driven ports"
            - pkg: "github.com/nats-io"
              desc: "no broker in the core -- ingest is a driving adapter"
            - pkg: "google.golang.org/grpc"
              desc: "no transport in the core -- grpc lives in adapters/driving"
            - pkg: "net/http"
              desc: "no transport in the core -- HTTP lives in adapters/driving"
            - pkg: "github.com/testcontainers"
              desc: "the core is tested without infrastructure"

        # 2. Adapters implement ports; they do not reach into use-cases.
        adapters-do-not-import-app:
          list-mode: lax
          files:
            - "**/adapters/**"
          deny:
            - pkg: "github.com/truongpx396/intel-notification/app"
              desc: "an adapter implements a port; it must not depend on the use-cases that call it"

        # 3. Nothing in the module imports a host product. This IS the extraction
        #    guarantee -- if it holds, the module builds with no host present.
        module-is-standalone:
          list-mode: lax
          files:
            - "**/*.go"
          deny:
            - pkg: "github.com/aisat"
              desc: "intel-notification is standalone -- it must never import the product it was extracted from"

        # 4. Test infrastructure stays in tests.
        testcontainers-only-in-tests:
          list-mode: lax
          files:
            - "$all"
            - "!$test"
            - "!**/internal/pgtest/**"
          deny:
            - pkg: "github.com/testcontainers"
              desc: "Testcontainers belongs to integration tests and internal/pgtest"

    paralleltest:
      # Table-driven subtests must be parallel too, not only top-level tests.
      ignore-missing-subtests: false

  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/truongpx396/intel-notification
