name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: schema (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    # Two majors, because the code has a branch for each where PostgreSQL moved something
    # (the checkpoint counters, in 17), and only a run on each holds both (D49).
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    steps:
      - uses: actions/checkout@v7
      - name: Migration hygiene
        run: make lint-sql
      # Applies every migration to a throwaway PostgreSQL, runs the schema tests as
      # the table owner (each raises on failure), and asserts the inherited
      # constraint still cannot be built. If that last one ever passes, D2's
      # premise changed and the build fails loudly rather than carrying a stale
      # decision.
      - name: Verify schema guarantees
        run: make verify-schema PG_IMAGE=postgres:${{ matrix.postgres }}-alpine

  unit:
    name: unit tests (no host present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod   # the toolchain directive: go1.26.8
      # The extraction guarantee, as a gate: the module builds and its tests
      # pass in a checkout containing only this module -- no host, no replace
      # directives (NS-009).
      - name: Build
        run: make build
      - name: Test (race detector, shuffled)
        run: make test

  integration:
    name: integration tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17]
    env:
      # Stated apart from the image below, so a leg whose image never reached the suite
      # fails instead of passing as a run on a server it did not use (internal/pgtest).
      PGTEST_EXPECT_MAJOR: ${{ matrix.postgres }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Starts PostgreSQL with Testcontainers; every test gets its own database
      # cloned from a migrated template, and runs as the non-superuser owner.
      - name: Test against PostgreSQL ${{ matrix.postgres }}
        run: make test-integration PG_IMAGE=postgres:${{ matrix.postgres }}-alpine

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: Architecture graph
        run: |
          go install github.com/fe3dback/go-arch-lint@v1.19.0
          make arch-lint

  proto:
    name: proto (lint, generated code, breaking changes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the breaking-change check compares with the base branch
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The versions are the Makefile's (BUF_VERSION, PROTOC_GEN_GO_VERSION, PROTOC_GEN_GO_GRPC_VERSION),
      # so a local `make proto` and this job generate the same bytes.
      - name: Install buf and the plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.60.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Lint
        run: make proto-lint
      - name: Generated code is current
        run: make proto-check
      - name: No breaking change against the base
        run: make proto-breaking PROTO_BASE=origin/${{ github.base_ref || 'main' }}

  e2e-suite:
    name: e2e suite compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      # Typechecks every spec and lists them, without starting the stack, so the
      # pending suite cannot rot before the service it tests exists.
      - name: Typecheck and list
        run: make e2e-list

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    if: false   # T047a: the REST surface exists (T044) but nothing assembles it into a service; enable with cmd/notifyd and service-mode auth (Stage 11)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Run against the compose stack
        run: make e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Relative links resolve
        run: make docs-links
