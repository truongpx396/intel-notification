name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  schema:
    name: schema (PostgreSQL 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migration hygiene
        run: make lint-sql
      # Applies every migration to a throwaway PG16, runs the 19 schema tests
      # as the table owner (each raises on failure), and asserts the inherited
      # constraint still cannot be built. If that last one ever passes, D2's
      # premise changed and the build fails loudly rather than carrying a stale
      # decision.
      - name: Verify schema guarantees
        run: make verify-schema

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relative links resolve
        run: make docs-links

  standalone:
    name: builds with no host present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      # The extraction guarantee, as a gate. Once Go code exists this runs
      # `go build ./... && go test ./...` in a checkout containing only this
      # module -- no host, no replace directives.
      - name: Build
        run: make build
      - name: Test
        run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    if: false   # enable with the first Go code (task T053)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: golangci/golangci-lint-action@v6
      - name: Architecture graph
        run: make arch-lint
