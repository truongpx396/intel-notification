# The hexagon's dependency graph, enforced in CI.
#
# Two rows carry the weight:
#   app may depend ONLY on ports + domain -- so the use-cases cannot reach infra.
#   driven/driving implement ports and may NOT depend on app -- so an adapter
#   cannot smuggle a use-case decision into itself.
#
# `cmd` is the only place allowed to assemble concrete implementations. That is
# what keeps the wiring in one readable file instead of spread across the tree.
#
# go-arch-lint refuses a component whose directory does not exist, so the layers
# not built yet are written below as comments: the graph is decided now, and each
# line is uncommented in the change that creates its directory.
version: 3
workdir: .
allow:
  depOnAnyVendor: true      # infra SDKs are gated by depguard, not here

excludeFiles:
  - "^.*_test\\.go$"        # tests may reach across layers to set up fixtures

components:
  config:     { in: . }                  # config.go: the one configuration surface
  domain:     { in: domain }
  ports:      { in: ports }
  driven:     { in: adapters/driven/** }
  migrations: { in: migrations }         # the embedded schema
  testing:    { in: internal/pgtest }    # integration-test support only
  notifytest: { in: internal/notifytest }  # the kit every suite is written against (T013a)
  # app:      { in: app/** }             # uncomment with the first use-case
  # driving:  { in: adapters/driving/** }
  # api:      { in: api/** }             # generated protobuf
  # cmd:      { in: cmd/** }

# A component absent from `deps` may depend on nothing in the project: domain is
# pure, and migrations (like api, later) is data.
deps:
  config:     { mayDependOn: [ domain ] }                          # Config.Realm is a domain.Realm
  ports:      { mayDependOn: [ domain ] }
  driven:     { mayDependOn: [ domain, ports, migrations ] }       # implements ports; NOT app
  testing:    { mayDependOn: [ migrations ] }
  notifytest: { mayDependOn: [ domain, ports, migrations, driven, testing ] }   # Env wires the PostgreSQL adapter over pgtest
  # app:      { mayDependOn: [ config, domain, ports ] }       # app.New takes a Config
  # driving:  { mayDependOn: [ domain, ports, api ] }
  # cmd:      { mayDependOn: [ config, domain, ports, app, driven, driving, api, migrations ] }
